<svg xmlns="http://www.w3.org/2000/svg" width="540" height="886" viewBox="0 0 540 886" role="img" aria-labelledby="title desc">
<title id="title">FinCo-Pilot: expense and commitment flowchart</title>
<desc id="desc">Illustrative diagram of Netflix, Prime Video, Zomato, Amazon, bills, EMIs, rent and utilities shown as manual expense categories flowing into a FinCo-Pilot-style dashboard. A reviewed balance of 25,000 rupees minus 15,500 rupees reserved leaves 9,500 rupees unallocated, not guaranteed safe to spend. No automatic brand integrations are claimed.</desc><defs>
<linearGradient id="back" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#121d32"/><stop offset=".57" stop-color="#0b1424"/><stop offset="1" stop-color="#16213b"/></linearGradient>
<linearGradient id="edge" x1="0" x2="1"><stop stop-color="#647994"/><stop offset=".5" stop-color="#e2edfc"/><stop offset="1" stop-color="#4c5d78"/></linearGradient>
<linearGradient id="gold" x1="0" y1="0" x2="1"><stop stop-color="#ffd97d"/><stop offset="1" stop-color="#e5ad41"/></linearGradient>
<linearGradient id="green" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#173f3a"/><stop offset="1" stop-color="#0e262c"/></linearGradient>
<linearGradient id="node" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#23324a"/><stop offset="1" stop-color="#18263b"/></linearGradient>
<filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="12"/></filter>
<filter id="light" x="-90%" y="-90%" width="280%" height="280%"><feGaussianBlur stdDeviation="4"/></filter>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#55dac7"/></marker>
</defs>
<style>
text{font-family:Arial,Helvetica,sans-serif}
@media (prefers-reduced-motion:reduce){.flow-pulse,.flow-dash,.breath{display:none}}
</style>
